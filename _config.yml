# Site settings
title: "Loïc Dumortier"
title_separator: "-"
name: "Loïc Dumortier"
email: loic.dumortier@proton.me
description: >-
  Computational chemist and physicist working on machine learning for molecular
  simulation, reactive force fields, and scientific software.
url: "https://loicdumortier.com"
baseurl: ""
repository: "lcdumort/lcdumort.github.io"
locale: "en-US"
timezone: Europe/Berlin

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default"

# SEO and social sharing
og_image: "/assets/images/og-image.jpg"
og_image_alt: "Loïc Dumortier, PhD — computational chemistry, machine learning, and molecular simulation"
twitter:
  username: lcdumortier
  card: summary_large_image

social:
  type: Person
  name: "Loïc Dumortier"
  links:
    - "https://github.com/lcdumort"
    - "https://linkedin.com/in/dumortier-loic"
    - "https://twitter.com/lcdumortier"

# There is no blog, so do not advertise an empty RSS feed.
atom_feed:
  hide: true

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-include-cache

# Files that should not be published
exclude:
  - .github
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

author:
  name: "Loïc Dumortier"
  avatar: "/assets/images/bio-photo.jpg"
  bio: >-
    Computational chemist and physicist at the German Aerospace Center (DLR),
    working on machine learning for molecular simulation, reactive force fields,
    and quantum computing in chemistry.
  location: "Cologne, Germany"
  twitter: lcdumortier
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/dumortier-loic"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lcdumort"
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:loic.dumortier@proton.me"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/lcdumortier"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/dumortier-loic"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lcdumort"
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:loic.dumortier@proton.me"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/lcdumortier"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
